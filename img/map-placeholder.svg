<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Fondo plano cartográfico -->
  <rect width="600" height="350" fill="#f1f5f9"/>
  <!-- Bloques de edificios / manzanas -->
  <rect x="40" y="40" width="140" height="100" fill="#e2e8f0" rx="4"/>
  <rect x="220" y="40" width="160" height="90" fill="#e2e8f0" rx="4"/>
  <rect x="420" y="40" width="140" height="110" fill="#e2e8f0" rx="4"/>
  <rect x="40" y="180" width="120" height="130" fill="#e2e8f0" rx="4"/>
  <rect x="200" y="170" width="190" height="140" fill="#cbd5e1" rx="4"/>
  <rect x="430" y="190" width="130" height="120" fill="#e2e8f0" rx="4"/>
  <!-- Calles -->
  <path d="M 0 160 L 600 160" stroke="#ffffff" stroke-width="24"/>
  <path d="M 190 0 L 190 350" stroke="#ffffff" stroke-width="20"/>
  <path d="M 405 0 L 405 350" stroke="#ffffff" stroke-width="20"/>
  <!-- Nombres de calles -->
  <text x="70" y="156" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">CALLE SAN FERNANDO</text>
  <text x="430" y="156" fill="#94a3b8" font-family="sans-serif" font-size="10">C. DIARIO DE CÓRDOBA</text>
  <!-- Marcador de ubicación de la tienda (Pin) -->
  <g transform="translate(295, 135)">
    <circle cx="0" cy="0" r="14" fill="#d97706" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#d97706"/>
    <!-- Icono de disco en el pin -->
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <!-- Etiqueta de la tienda -->
  <rect x="210" y="80" width="170" height="38" fill="#18181b" rx="6"/>
  <text x="295" y="98" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">La Vinilería Córdoba</text>
  <text x="295" y="111" fill="#d97706" font-family="sans-serif" font-size="9" text-anchor="middle">C/ San Fernando, 12</text>
  <polygon points="295,124 289,118 301,118" fill="#18181b"/>
</svg>
